<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${student.id}" th:text="'Modifier Étudiant - ' + ${student.name}">Ajouter Étudiant</title>
    <title th:unless="${student.id}">Ajouter Étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:if="${student.id}">Modifier Étudiant</h1>
        <h1 th:unless="${student.id}">Ajouter Étudiant</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <form th:action="${student.id ? '/students/' + student.id : '/students'}" th:method="${student.id ? 'post' : 'post'}" class="mt-4">
            <div class="mb-3">
                <label for="id" class="form-label">ID</label>
                <input type="text" class="form-control" id="id" name="id" th:value="${student.id}" required th:disabled="${student.id != null}">
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Nom</label>
                <input type="text" class="form-control" id="name" name="name" th:value="${student.name}" required>
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">Âge</label>
                <input type="number" class="form-control" id="age" name="age" th:value="${student.age}" required>
            </div>
            <div class="mb-3">
                <label for="classLevel" class="form-label">Niveau de classe</label>
                <select class="form-control" id="classLevel" name="classLevel" required>
                    <option value="Classe 1" th:selected="${student.classLevel == 'Classe 1'}">Classe 1</option>
                    <option value="Classe 2" th:selected="${student.classLevel == 'Classe 2'}">Classe 2</option>
                    <option value="Classe 3" th:selected="${student.classLevel == 'Classe 3'}">Classe 3</option>
                    <option value="Classe 4" th:selected="${student.classLevel == 'Classe 4'}">Classe 4</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" th:text="${student.id ? 'Modifier' : 'Ajouter'}">Ajouter</button>
            <a href="/students" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
