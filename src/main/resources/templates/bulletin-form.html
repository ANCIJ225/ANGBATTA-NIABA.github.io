<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Générer Bulletin - Gestionnaire Académique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Générer Bulletin</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <form action="/bulletin" method="post" class="mt-4">
            <div class="mb-3">
                <label for="studentId" class="form-label">Étudiant</label>
                <select class="form-control" id="studentId" name="studentId" required>
                    <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="period" class="form-label">Période</label>
                <input type="text" class="form-control" id="period" name="period" placeholder="ex: 2024" required>
            </div>
            <button type="submit" class="btn btn-primary">Générer Bulletin</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
