<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionnaire Académique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Bienvenue dans le Gestionnaire Académique</h1>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Étudiants</h5>
                        <p class="card-text h2" th:text="${stats.studentCount}">0</p>
                        <a href="/students" class="btn btn-primary">Gérer</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Cours</h5>
                        <p class="card-text h2" th:text="${stats.courseCount}">0</p>
                        <a href="/courses" class="btn btn-success">Gérer</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Notes</h5>
                        <p class="card-text h2" th:text="${stats.gradeCount}">0</p>
                        <a href="/grades" class="btn btn-warning">Gérer</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Promotion</h5>
                        <form action="/promote" method="post" class="d-inline">
                            <input type="hidden" name="period" value="2024">
                            <button type="submit" class="btn btn-info">Promouvoir</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${stats.average}" class="mt-4">
            <h3>Statistiques générales</h3>
            <p>Moyenne générale: <strong th:text="${#numbers.formatDecimal(stats.average, 1, 2)}">0.00</strong></p>
            <p>Note minimale: <strong th:text="${stats.min}">0</strong></p>
            <p>Note maximale: <strong th:text="${stats.max}">0</strong></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
