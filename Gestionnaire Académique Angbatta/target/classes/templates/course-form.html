<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${course.id}" th:text="'Modifier Cours - ' + ${course.name}">Ajouter Cours</title>
    <title th:unless="${course.id}">Ajouter Cours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:if="${course.id}">Modifier Cours</h1>
        <h1 th:unless="${course.id}">Ajouter Cours</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <form th:action="${course.id ? '/courses/' + course.id : '/courses'}" th:method="${course.id ? 'post' : 'post'}" class="mt-4">
            <div class="mb-3">
                <label for="id" class="form-label">ID</label>
                <input type="text" class="form-control" id="id" name="id" th:value="${course.id}" required th:disabled="${course.id != null}">
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Nom</label>
                <input type="text" class="form-control" id="name" name="name" th:value="${course.name}" required>
            </div>
            <button type="submit" class="btn btn-primary" th:text="${course.id ? 'Modifier' : 'Ajouter'}">Ajouter</button>
            <a href="/courses" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
