<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Étudiants - Gestionnaire Académique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Étudiants</h1>
            <a href="/students/add" class="btn btn-primary">Ajouter Étudiant</a>
        </div>

        <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Âge</th>
                        <th>Niveau</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.age}"></td>
                        <td th:text="${student.classLevel}"></td>
                        <td>
                            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-sm btn-warning">Modifier</a>
                            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cet étudiant ?')">
                                <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(students)}" class="alert alert-info">
            Aucun étudiant enregistré.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
