<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${grade.student}" th:text="'Modifier Note - ' + ${grade.student.name}">Ajouter Note</title>
    <title th:unless="${grade.student}">Ajouter Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:if="${grade.student}">Modifier Note</h1>
        <h1 th:unless="${grade.student}">Ajouter Note</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <form th:action="${grade.student ? '/grades/' + grade.student.id + '/' + grade.course.id + '/' + grade.period : '/grades'}" th:method="post" class="mt-4">
            <div class="mb-3">
                <label for="studentId" class="form-label">Étudiant</label>
                <select class="form-control" id="studentId" name="studentId" required th:disabled="${grade.student != null}">
                    <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name}" th:selected="${grade.student != null and grade.student.id == student.id}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="courseId" class="form-label">Cours</label>
                <select class="form-control" id="courseId" name="courseId" required th:disabled="${grade.course != null}">
                    <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}" th:selected="${grade.course != null and grade.course.id == course.id}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="value" class="form-label">Note (0-20)</label>
                <input type="number" step="0.01" min="0" max="20" class="form-control" id="value" name="value" th:value="${grade.value}" required>
            </div>
            <div class="mb-3">
                <label for="period" class="form-label">Période</label>
                <input type="text" class="form-control" id="period" name="period" th:value="${grade.period}" required th:disabled="${grade.period != null and grade.period != ''}">
            </div>
            <button type="submit" class="btn btn-primary" th:text="${grade.student ? 'Modifier' : 'Ajouter'}">Ajouter</button>
            <a href="/grades" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
