<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bulletin - Gestionnaire Académique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Bulletin de <span th:text="${bulletin.student.name}"></span></h1>
        <h2>Période: <span th:text="${bulletin.period}"></span></h2>

        <div class="card mt-4">
            <div class="card-header">
                <h5>Notes</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Cours</th>
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="grade : ${bulletin.grades}">
                            <td th:text="${grade.course.name}"></td>
                            <td th:text="${grade.value}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="alert alert-info mt-3">
            <strong>Moyenne générale: <span th:text="${#numbers.formatDecimal(bulletin.average, 1, 2)}"></span></strong>
        </div>

        <a href="/bulletin" class="btn btn-primary">Générer un autre bulletin</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
