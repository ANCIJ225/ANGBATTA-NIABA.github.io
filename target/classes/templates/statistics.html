<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Statistiques - Gestionnaire Académique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Statistiques</h1>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Nombre d'étudiants</h5>
                        <p class="card-text h2" th:text="${stats.studentCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Nombre de cours</h5>
                        <p class="card-text h2" th:text="${stats.courseCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Nombre de notes</h5>
                        <p class="card-text h2" th:text="${stats.gradeCount}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${stats.average}" class="mt-4">
            <h3>Statistiques des notes</h3>
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h5 class="card-title">Moyenne générale</h5>
                            <p class="card-text h3" th:text="${#numbers.formatDecimal(stats.average, 1, 2)}">0.00</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h5 class="card-title">Note minimale</h5>
                            <p class="card-text h3" th:text="${stats.min}">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h5 class="card-title">Note maximale</h5>
                            <p class="card-text h3" th:text="${stats.max}">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${stats.classDistribution}" class="mt-4">
            <h3>Répartition par classe</h3>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Classe</th>
                            <th>Nombre d'étudiants</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${stats.classDistribution}">
                            <td th:text="${entry.key}"></td>
                            <td th:text="${entry.value}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
