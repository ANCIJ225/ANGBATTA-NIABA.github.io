<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notes - Gestionnaire Académique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Gestionnaire Académique</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/students">Étudiants</a>
                <a class="nav-link" href="/courses">Cours</a>
                <a class="nav-link" href="/grades">Notes</a>
                <a class="nav-link" href="/bulletin">Bulletin</a>
                <a class="nav-link" href="/statistics">Statistiques</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Notes</h1>
            <a href="/grades/add" class="btn btn-primary">Ajouter Note</a>
        </div>

        <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Étudiant</th>
                        <th>Cours</th>
                        <th>Note</th>
                        <th>Période</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="grade : ${grades}">
                        <td th:text="${grade.student.name}"></td>
                        <td th:text="${grade.course.name}"></td>
                        <td th:text="${grade.value}"></td>
                        <td th:text="${grade.period}"></td>
                        <td>
                            <a th:href="@{/grades/{studentId}/{courseId}/{period}/edit(studentId=${grade.student.id}, courseId=${grade.course.id}, period=${grade.period})}" class="btn btn-sm btn-warning">Modifier</a>
                            <form th:action="@{/grades/{studentId}/{courseId}/{period}/delete(studentId=${grade.student.id}, courseId=${grade.course.id}, period=${grade.period})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cette note ?')">
                                <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(grades)}" class="alert alert-info">
            Aucune note enregistrée.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
